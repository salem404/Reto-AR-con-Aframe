<html>
  <head>
    <title>AR</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Permissions-Policy"
      content="xr-spatial-tracking=(self)"
    />
    <style>
      #overlay {
        z-index: 2;
      }
    </style>
    <script>
      // WebXR requires HTTPS, so the site doesn't work if someone manually enters
      // the URL and ends up using HTTP. To work around this, force redirect from
      // http to https for non-localhost addresses.
      if (
        window.location.protocol == "http:" &&
        window.location.hostname != "localhost" &&
        window.location.hostname != "127.0.0.1" &&
        window.location.hostname != "[::1]"
      ) {
        window.location = window.location.href.replace("http:", "https:")
      }
    </script>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/@c-frame/aframe-particle-system-component@1.2.x/dist/aframe-particle-system-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-simple-sun-sky@^1.2.2/simple-sun-sky.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script>
      // Simple gravity component for the sphere
      AFRAME.registerComponent('simple-gravity', {
        schema: {
          velocity: {type: 'vec3', default: {x: 0, y: 0, z: 0}},
          gravity: {type: 'number', default: -9.8},
          groundY: {type: 'number', default: 0},
          bounce: {type: 'number', default: 0.5}
        },
        
        init: function() {
          this.velocity = new THREE.Vector3(
            this.data.velocity.x, 
            this.data.velocity.y, 
            this.data.velocity.z
          );
        },
        
        tick: function(time, deltaTime) {
          if (!deltaTime) return;
          
          const dt = deltaTime / 1000; // Convert to seconds
          const position = this.el.object3D.position;
          
          // Apply gravity
          this.velocity.y += this.data.gravity * dt;
          
          // Update position
          position.x += this.velocity.x * dt;
          position.y += this.velocity.y * dt;
          position.z += this.velocity.z * dt;
          
          // Check ground collision
          const radius = this.el.getAttribute('radius') || 0.5;
          if (position.y - radius <= this.data.groundY) {
            position.y = this.data.groundY + radius;
            this.velocity.y = -this.velocity.y * this.data.bounce;
            
            // Stop bouncing when velocity is very small
            if (Math.abs(this.velocity.y) < 0.1) {
              this.velocity.y = 0;
            }
          }
        }
      });
    </script>
    <script>
      // Define a few custom components useful for AR mode. While these are somewhat reusable,
      // I recommend checking if there are officially supported alternatives before copying
      // these into new projects.

      // See also https://github.com/aframevr/aframe/pull/4356
      if (!AFRAME.components["hide-on-enter-ar"]) {
        AFRAME.registerComponent("hide-on-enter-ar", {
          // Set this object invisible while in AR mode, but visible in VR mode.
          init: function () {
            this.el.sceneEl.addEventListener("enter-vr", (ev) => {
              this.wasVisible = this.el.getAttribute("visible")
              if (this.el.sceneEl.is("ar-mode")) {
                this.el.setAttribute("visible", false)
              } else {
                // In VR mode, make sure it's visible
                this.el.setAttribute("visible", true)
              }
            })
            this.el.sceneEl.addEventListener("exit-vr", (ev) => {
              if (this.wasVisible) this.el.setAttribute("visible", true)
            })
          },
        })
      }

      if (!AFRAME.components["ar-shadows"]) {
        AFRAME.registerComponent("ar-shadows", {
          // Swap an object's material to a transparent shadows-only material while
          // in AR mode. Intended for use with a ground plane. The object is also
          // set visible while in AR mode, this is useful if it's hidden in other
          // modes due to them using a 3D environment.
          schema: {
            opacity: { default: 0.3 },
          },
          init: function () {
            this.el.sceneEl.addEventListener("enter-vr", (ev) => {
              this.wasVisible = this.el.getAttribute("visible")
              if (this.el.sceneEl.is("ar-mode")) {
                // Add null check to prevent crashes
                if (
                  this.el.object3D.children[0] &&
                  this.el.object3D.children[0].material
                ) {
                  this.savedMaterial = this.el.object3D.children[0].material
                  this.el.object3D.children[0].material =
                    new THREE.ShadowMaterial()
                  this.el.object3D.children[0].material.opacity =
                    this.data.opacity
                }
                this.el.setAttribute("visible", true)
              }
            })
            this.el.sceneEl.addEventListener("exit-vr", (ev) => {
              if (this.savedMaterial && this.el.object3D.children[0]) {
                this.el.object3D.children[0].material = this.savedMaterial
                this.savedMaterial = null
              }
              if (!this.wasVisible) this.el.setAttribute("visible", false)
            })
          },
        })
      }
    </script>
  </head>
  <body>
    <div id="overlay">
      <header>
        <a
          href="https://github.com/salem404/Reto-AR-con-Aframe"
          class="github-corner"
          aria-label="View source on Github"
        >
          <svg
            width="80"
            height="80"
            viewBox="0 0 250 250"
            style="
              fill: #151513;
              color: #fff;
              position: absolute;
              top: 0;
              border: 0;
              right: 0;
            "
            aria-hidden="true"
          >
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path
              d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
              fill="currentColor"
              style="transform-origin: 130px 106px"
              class="octo-arm"
            ></path>
            <path
              d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
              fill="currentColor"
              class="octo-body"
            ></path>
          </svg>
        </a>
      </header>
    </div>
    <a-scene
      webxr="optionalFeatures: hit-test,dom-overlay,local-floor,bounded-floor; overlayElement: #overlay"
      xr-mode-ui="XRMode: xr"
      renderer="colorManagement: true; antialias: true; foveationLevel: 1"
    >
      <a-entity id="rig" position="0 0 0">
        <a-camera
          position="0 1.5 0"
          look-controls
          wasd-controls-enabled="true"
        ></a-camera>
        <!-- VR Controllers -->
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable"
        ></a-entity>
      </a-entity>
      <a-assets timeout="30000">
        <a-asset-item
          id="avatarModel"
          src="assets/waves3.glb"
          response-type="arraybuffer"
        ></a-asset-item>
      </a-assets>
      <a-entity
        id="avatar"
        position="0 0 -1"
        rotation="0 0 0"
        gltf-model="#avatarModel"
        animation-mixer
        shadow="cast: true; receive: true"
      ></a-entity>
      
      <!-- Physics Sphere behind the avatar -->
      <a-sphere
        position="0 2 -2"
        radius="0.5"
        color="#4CC3D9"
        shadow="cast: true; receive: true"
        simple-gravity="groundY: 0; bounce: 0.5"
      ></a-sphere>
      
      <a-plane
        height="15"
        width="15"
        position="0 0 -1"
        rotation="-90 0 0"
        shadow="receive: true"
        ar-shadows="opacity: 0.3"
        visible="true"
        color="#666"
      ></a-plane>
      <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
      <a-light
        type="directional"
        light="castShadow: true;
          shadowMapHeight: 1024;
          shadowMapWidth: 1024;
          shadowCameraLeft: -7;
          shadowCameraRight: 5;
          shadowCameraBottom: -5;
          shadowCameraTop: 5;"
        id="light"
        target="avatar"
        position="-5 3 1.5"
      ></a-light>
      <a-entity
        id="rain"
        particle-system="preset: rain; color: #2e282a; particleCount: 500"
      ></a-entity>
      <a-sky hide-on-enter-ar color="#2e282a"></a-sky>
      <a-entity
        hide-on-enter-ar
        id="ocean"
        ocean="density: 40; width: 50; depth: 50; speed: 1"
        material="color: #ef3e36; opacity: 0.75; metalness: 1; roughness: 1"
        rotation="-90 0 0"
      ></a-entity>
      <a-entity
        hide-on-enter-ar
        light="type: ambient; color: #ef3e36"
      ></a-entity>
      <a-entity hand-tracking-controls="hand: left"></a-entity>
      <a-entity hand-tracking-controls="hand: right"></a-entity>
    </a-scene>
  </body>
</html>
